# The whole platform, on a laptop, in one command (ADR-0010).
#
#   docker compose -f deploy/compose/docker-compose.yml up -d
#
# Host ports are overridable. Copy .env.example to .env if the defaults collide with
# something already running on your machine; nothing inside the network changes.
#
# Footprint: roughly 2 GB with the three services, PostgreSQL and Kafka. The
# observability stack arrives in Phase 4 behind a profile, so the everyday loop stays
# light.

name: maestro

services:

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: maestro
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Creates one login role and one schema per service, with no cross-grants, so
      # "no service reads another's tables" fails at runtime rather than at review.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      # PostgreSQL 18 images expect the mount one level above the data directory, so
      # that a future pg_upgrade --link does not straddle a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro -d maestro"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # KRaft, single node. The broker version matches the client version managed by the
    # Spring Boot BOM, so local behaviour matches what the services were compiled against.
    image: apache/kafka:4.2.1
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two listeners: services inside the network reach kafka:9092, tools on the host
      # reach localhost:19092. They must advertise different addresses or one of the two
      # will be handed an address it cannot resolve.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off, deliberately. With it on, a consumer that subscribes before the topics are
      # declared causes the broker to invent them with one partition; KafkaAdmin then
      # widens them to six, and the consumer group carries on holding its original single
      # assignment until an unrelated metadata refresh happens to notice. The symptom is a
      # service silently receiving a fraction of the events addressed to it.
      #
      # With it off, the only way a topic exists is because a service declared it with the
      # partition count ADR-0005 calls for, and an early subscriber waits instead.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: maestro-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  acquirer-sim:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: acquirer-sim
    environment:
      # Containers log ECS JSON so every line carries trace_id, payment_id and
      # merchant_id as fields; `gradlew bootRun` keeps the human-readable pattern.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "${ACQUIRER_SIM_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  payment-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: payment-api
    environment:
      DB_HOST: postgres
      DB_USER: maestro_payment
      DB_PASSWORD: maestro_payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "${PAYMENT_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  ledger:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: ledger
    environment:
      DB_HOST: postgres
      # Two roles, deliberately (ADR-0016): migrations run as the schema owner, the
      # application connects as a role that cannot UPDATE or DELETE a posting.
      DB_USER: maestro_ledger
      DB_PASSWORD: maestro_ledger
      DB_MIGRATION_USER: maestro_ledger_migrator
      DB_MIGRATION_PASSWORD: maestro_ledger_migrator
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_OPS_TOKEN: ${LEDGER_OPS_TOKEN:-ops_local_token}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "${LEDGER_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  router:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: router
    environment:
      DB_HOST: postgres
      DB_USER: maestro_routing
      DB_PASSWORD: maestro_routing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACQUIRER_SIM_URL: http://acquirer-sim:8082
      ROUTER_OPS_TOKEN: ${ROUTER_OPS_TOKEN:-ops_local_token}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "${ROUTER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      acquirer-sim:
        condition: service_healthy
    healthcheck:
      # Without this, `up --wait` reports the router ready the moment the process
      # starts, and a demo can fire before the consumer has joined its group.
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
