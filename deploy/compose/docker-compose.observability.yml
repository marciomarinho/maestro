# The observability stack, as an overlay (the profile the base file promises).
#
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.observability.yml up -d
#
# An overlay rather than a profile because it does two things a profile cannot: it adds
# the three backends AND flips the services into exporting spans. Without it the
# services still create and propagate traces — they just keep them to themselves — so
# the everyday loop stays light and nothing logs errors about a collector that is not
# there.
#
# Grafana:    http://localhost:3000   (anonymous admin, local only)
# Prometheus: http://localhost:9090
# Tempo:      http://localhost:3200

name: maestro

services:

  payment-api:
    environment:
      TRACING_EXPORT_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

  router:
    environment:
      TRACING_EXPORT_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

  ledger:
    environment:
      TRACING_EXPORT_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

  acquirer-sim:
    environment:
      TRACING_EXPORT_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      # The query API, for Grafana on the host or a curious curl. OTLP ingest (4318)
      # stays internal: only the services publish spans.
      - "${TEMPO_PORT:-3200}:3200"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # k6 streams its client-side metrics here during load runs, so a run and the
      # platform's own telemetry land on the same dashboards with the same clock.
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Local-only convenience. Phase 6 brings real identity; a password prompt on a
      # laptop dashboard before then would protect nothing and annoy everyone.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  tempo-data:
