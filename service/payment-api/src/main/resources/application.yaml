spring:
  application:
    name: payment-api
  threads:
    virtual:
      enabled: true                 # ADR-0002: blocking code on virtual threads
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  datasource:
    # Connects as its own role, which holds grants on the payment schema and nothing
    # else. Cross-service reads fail at runtime rather than at code review (ADR-0010).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maestro}
    username: ${DB_USER:maestro_payment}
    password: ${DB_PASSWORD:maestro_payment}
    hikari:
      maximum-pool-size: 16
      pool-name: payment-api

  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    # db/demo carries the local demo merchant and API key; it is opt-in per profile.
    locations: classpath:db/migration,classpath:db/demo

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                     # a lost command is a stuck payment
    consumer:
      group-id: payment-api
      auto-offset-reset: earliest
      enable-auto-commit: false     # offsets follow the effect, never precede it
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # Partitions exist to be used. One thread per listener would leave five of six
      # partitions idle and reproduce the head-of-line blocking the partitioning was
      # meant to prevent — a payment waiting on an unresolved authorization would still
      # hold up unrelated payments assigned to the same thread (ADR-0005).
      concurrency: 3
      # Record processing runs inside an observation. The tracing bridge extracts the
      # traceparent header before the handler runs, so the listener span joins the
      # payment's originating trace rather than starting a fresh one.
      observation-enabled: true

server:
  port: 8080

maestro:
  outbox:
    schema: payment
    poll-interval: 500ms            # the safety net; latency comes from after-commit wake-ups
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  # Histogram buckets on the latency SLO sources, so Prometheus can compute the
  # percentiles the operations SLO table is stated in.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Metrics leave by Prometheus scrape only. The OTel starter also brings an OTLP
  # metrics registry, which left enabled would push to a collector that is not there.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # Sample everything. Local volumes are demo-scale, and a sampled-out trace of the
    # one interesting payment defeats the purpose of having traces at all.
    sampling:
      probability: 1.0
    # Spans are created and propagated unconditionally; they leave the process only
    # when the observability stack is up to receive them. The compose overlay flips
    # this and points the endpoint at Tempo.
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    dev.maestro: INFO
