spring:
  application:
    name: acquirer-sim
  threads:
    virtual:
      enabled: true          # ADR-0002: blocking code on virtual threads, not reactive
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8082

maestro:
  acquirer-sim:
    # Three acquirers, all healthy, differing only in how quickly they answer. Nothing
    # here says which is cheapest — that is the platform's commercial agreement, not
    # something an acquirer tells you — and nothing says which is best, because the
    # router is supposed to find that out from live traffic rather than be told.
    acquirers:
      - id: southcross
        name: Southcross Payments
        latency: 32ms
      - id: northbank
        name: Northbank Acquiring
        latency: 45ms
      - id: meridian
        name: Meridian Card Services
        latency: 68ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  # Histogram buckets on the latency SLO sources, so Prometheus can compute the
  # percentiles the operations SLO table is stated in.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Metrics leave by Prometheus scrape only. The OTel starter also brings an OTLP
  # metrics registry, which left enabled would push to a collector that is not there.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # Sample everything. Local volumes are demo-scale, and a sampled-out trace of the
    # one interesting payment defeats the purpose of having traces at all.
    sampling:
      probability: 1.0
    # Spans are created and propagated unconditionally; they leave the process only
    # when the observability stack is up to receive them. The compose overlay flips
    # this and points the endpoint at Tempo.
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    dev.maestro: INFO
