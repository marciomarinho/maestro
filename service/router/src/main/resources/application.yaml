spring:
  application:
    name: router
  threads:
    virtual:
      enabled: true                 # thousands of concurrent acquirer calls, blocking style
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maestro}
    username: ${DB_USER:maestro_routing}
    password: ${DB_PASSWORD:maestro_routing}
    hikari:
      maximum-pool-size: 16
      pool-name: router

  flyway:
    enabled: true
    schemas: routing
    default-schema: routing
    # db/demo carries the acquiring agreements for the three simulated acquirers. The
    # table is schema; the commercial terms in it are a local fixture.
    locations: classpath:db/migration,classpath:db/demo

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: router
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # Partitions exist to be used — all six of them (ADR-0005). A listener thread
      # here holds an acquirer call (~45 ms healthy, seconds in a brownout), which
      # makes this the platform's authorization-throughput ceiling: the 2026-08-12
      # load report measured 3 threads saturating at ~49 authorizations/s while the
      # HTTP front door cheerfully accepted 100/s, and the gap became router consumer
      # lag. Six threads, one per partition, doubled the ceiling; past this, the next
      # step is more instances, not more threads.
      concurrency: 6
      # Record processing runs inside an observation. The tracing bridge extracts the
      # traceparent header before the handler runs, so the listener span joins the
      # payment's originating trace rather than starting a fresh one.
      observation-enabled: true

server:
  port: 8081

maestro:
  outbox:
    schema: routing
    poll-interval: 500ms
    batch-size: 100
  router:
    request-timeout: 5s
    # Guards /ops/routing, which exposes which banks the platform deals with, what it
    # thinks of them and what they cost. A placeholder until Phase 6 brings real identity.
    ops-token: ${ROUTER_OPS_TOKEN:ops_local_token}

    # How fast the router changes its mind. The half-life is the only responsiveness
    # tunable; everything else here is about how much evidence an opinion needs before
    # it is allowed to be a strong one.
    health:
      half-life: 30s
      prior-approval-rate: 0.90
      prior-technical-failure-rate: 0.02
      prior-weight: 20
      restored-sample-cap: 10
      snapshot-interval: 10s

    # What the router values, and by how much. Availability outweighs cost roughly three
    # to one: an acquirer thirty basis points cheaper that fails one request in five is
    # not cheaper. See RouterProperties.Scoring for the full argument.
    scoring:
      approval-weight: 1.0
      technical-weight: 1.2
      latency-weight: 0.15
      cost-weight: 0.40

    # How hard to try before giving up on a payment. Bounded three ways, because each
    # bound stops a different failure: walking every bank, re-offering to acquirers that
    # already failed, and every payment retrying at once during an outage.
    failover:
      max-acquirers: 3
      same-acquirer-retries: 2
      backoff: 50ms
      max-backoff: 500ms

    # When to stop asking an acquirer at all. Consecutive failures rather than a rate:
    # the rate already has an owner above.
    breaker:
      failure-threshold: 5
      open-duration: 15s

    # The cap that stops one acquirer's outage becoming a platform-wide retry storm.
    retry-budget:
      ratio: 0.10
      minimum-retries: 5
      window: 10s

    # Connectivity only. What each acquirer costs is a commercial agreement and lives in
    # the acquirer_corridor table; how healthy each one is, the router works out for
    # itself. All three resolve to the same simulator, which impersonates each of them
    # under its own identity (ADR-0011).
    acquirers:
      - id: southcross
        base-url: ${ACQUIRER_SIM_URL:http://localhost:8082}
      - id: northbank
        base-url: ${ACQUIRER_SIM_URL:http://localhost:8082}
      - id: meridian
        base-url: ${ACQUIRER_SIM_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  # Histogram buckets on the latency SLO sources, so Prometheus can compute the
  # percentiles the operations SLO table is stated in.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        maestro.router.acquirer.latency: true
  # Metrics leave by Prometheus scrape only. The OTel starter also brings an OTLP
  # metrics registry, which left enabled would push to a collector that is not there.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # Sample everything. Local volumes are demo-scale, and a sampled-out trace of the
    # one interesting payment defeats the purpose of having traces at all.
    sampling:
      probability: 1.0
    # Spans are created and propagated unconditionally; they leave the process only
    # when the observability stack is up to receive them. The compose overlay flips
    # this and points the endpoint at Tempo.
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    dev.maestro: INFO
