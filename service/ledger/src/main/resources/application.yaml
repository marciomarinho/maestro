spring:
  application:
    name: ledger
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  datasource:
    # The application role. It holds SELECT and INSERT on postings and nothing more —
    # no UPDATE, no DELETE — which is what makes append-only a privilege it does not
    # have rather than a rule it is asked to follow (ADR-0016).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maestro}
    username: ${DB_USER:maestro_ledger}
    password: ${DB_PASSWORD:maestro_ledger}
    hikari:
      maximum-pool-size: 16
      pool-name: ledger

  flyway:
    enabled: true
    schemas: ledger
    default-schema: ledger
    # Migrations run as the schema owner, which is deliberately NOT the role the
    # application uses. An owner can always grant privileges back to itself, so a single
    # role could not make posting mutation impossible.
    user: ${DB_MIGRATION_USER:maestro_ledger_migrator}
    password: ${DB_MIGRATION_PASSWORD:maestro_ledger_migrator}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3            # one thread per partition group (ADR-0005)
      # Record processing runs inside an observation. The tracing bridge extracts the
      # traceparent header before the handler runs, so the listener span joins the
      # payment's originating trace rather than starting a fresh one.
      observation-enabled: true

server:
  port: 8083

maestro:
  ledger:
    ops-token: ${LEDGER_OPS_TOKEN:ops_local_token}
    verification-interval: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  # Histogram buckets on the latency SLO sources, so Prometheus can compute the
  # percentiles the operations SLO table is stated in.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Metrics leave by Prometheus scrape only. The OTel starter also brings an OTLP
  # metrics registry, which left enabled would push to a collector that is not there.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # Sample everything. Local volumes are demo-scale, and a sampled-out trace of the
    # one interesting payment defeats the purpose of having traces at all.
    sampling:
      probability: 1.0
    # Spans are created and propagated unconditionally; they leave the process only
    # when the observability stack is up to receive them. The compose overlay flips
    # this and points the endpoint at Tempo.
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    dev.maestro: INFO
